<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DES_AI競馬予想</title>
  <link rel="canonical" href="https://aipapa247272.github.io/keiba-auto-gist-updater/">
  <meta http-equiv="refresh" content="0; url=https://aipapa247272.github.io/keiba-auto-gist-updater/">
  <script>
    (function () {
      const targetBase = 'https://aipapa247272.github.io/keiba-auto-gist-updater/';
      const path = location.pathname && location.pathname !== '/' ? location.pathname.replace(/^\//, '') : '';
      const query = location.search || '';
      const hash = location.hash || '';
      const target = targetBase + path + query + hash;
      location.replace(target);
    })();
  </script>

      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
