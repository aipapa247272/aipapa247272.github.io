<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=https://aipapa247272.github.io/keiba-auto-gist-updater/">
  <script>
    (function () {
      const targetBase = 'https://aipapa247272.github.io/keiba-auto-gist-updater/';
      const path = location.pathname && location.pathname !== '/' ? location.pathname.replace(/^\//, '') : '';
      const query = location.search || '';
      const hash = location.hash || '';
      const target = targetBase + path + query + hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p><a href="https://aipapa247272.github.io/keiba-auto-gist-updater/">DES_AI競馬予想へ移動</a></p>
</body>
</html>
